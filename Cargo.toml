[package]
name = "virial-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A simple Linux file manager built with GPUI"

[dependencies]
gpui = "=0.2.2"
# GPUI's xattr 0.2 dependency uses ENOATTR, removed by newer libc releases.
libc = "=0.2.186"
roxmltree = "0.20"
url = "2.5"
zbus = "5.19"
chrono = { version = "0.4", default-features = false, features = ["std"] }
unicode-segmentation = "1.13"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tempfile = "3"
sha2 = "0.10"
