[package]
name = "virial-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A simple Linux file manager built with GPUI"

[build-dependencies]
# Windows-only resource compiler used by `build.rs` to embed the
# application icon and the PerMonitorV2 DPI-aware manifest into
# `virial-gpui.exe`. Kept off the Linux build because `winres` requires
# the `windres` MinGW toolchain that the CI runner does not install.
winres = { version = "0.1", optional = true }

[features]
# Enables the Windows-only resource embedding step. Off by default so
# `cargo build` on Linux and macOS does not pull `winres`; the CI
# Windows job (and downstream installers) flip it on with
# `--features windows-resources`.
windows-resources = ["dep:winres"]

[dependencies]
gpui = "=0.2.2"
# GPUI's xattr 0.2 dependency uses ENOATTR, removed by newer libc releases.
libc = "=0.2.186"
# Load the optional media backend without requiring development headers.
libloading = "0.8"
# SSH remote browsing (russh 0.62 + russh-sftp 2.4 are the pair documented and
# CI-tested together; russh 0.63+ pulls a release-candidate ssh-key).
russh = "=0.62.7"
russh-sftp = "=2.4.0"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "net", "time", "macros"] }
home = "0.5"
roxmltree = "0.20"
url = "2.5"
zbus = "5.19"
futures-lite = "2.6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
unicode-segmentation = "1.13"
# The onig engine bundles PowerShell, JSX and other grammars the fancy-regex
# variant lacks (strict superset of the fancy syntax set).
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tempfile = "3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
webp = { version = "0.3", default-features = false }
oxipng = { version = "10.2", default-features = false }

# GPUI is selected per target: Linux keeps the Wayland/X11 backends, macOS
# needs the Metal one (`macos-blade`), Windows keeps its own default.
# All three resolve to the same patched crate thanks to `[patch.crates-io]`.
[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", features = ["wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["macos-blade", "font-kit"] }

[target.'cfg(windows)'.dependencies]
gpui = { version = "=0.2.2", features = ["windows-manifest"] }

# Free-space queries, volume discovery and journal locks, without a COM dependency.
# The Win32_UI and Win32_System_Com features are required by the brand-identity
# code in `platform::windows::desktop` (`SetCurrentProcessExplicitAppUserModelID`
# lives in the Shell API, and the COM allocator is needed for the OLE strings we
# pass to it). `Win32_System_Com` is also pulled in for the registry helpers
# we bind at runtime.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_UI_Shell",
] }

# Native outgoing file drags are not exposed by upstream GPUI 0.2.2.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
# Fix Rust's future-incompatibility warning in proc-macro-error2 2.0.1.
proc-macro-error2 = { path = "vendor/proc-macro-error2" }

# The parent directory contains unrelated manifests; keep this package standalone.
[workspace]
