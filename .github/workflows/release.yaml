name: Publish Debian package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must match Cargo.toml: v{version}")
          PY
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 dpkg-dev binutils desktop-file-utils libfontconfig1-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libasound2-dev libvulkan-dev
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build Debian package
        run: |
          desktop-file-validate packaging/virial-gpui.desktop
          ./build-deb.sh
          dpkg-deb --info target/debian/*.deb
      - name: Upload Debian package
        uses: actions/upload-artifact@v6
        with:
          name: virial-gpui-deb-ubuntu-24.04-amd64
          path: target/debian/*.deb
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" target/debian/*.deb --clobber
          else
            gh release create "$RELEASE_TAG" target/debian/*.deb --verify-tag --generate-notes --title "Virial $RELEASE_TAG"
          fi
