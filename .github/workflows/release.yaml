name: Build and publish releases (Linux, macOS, Windows)

on:
  # Automatic release: when the CI finishes on `main`. `prepare` below
  # refuses to publish unless the CI succeeded AND `Cargo.toml` declares a
  # version with no tag yet — a release is exactly "a green main with a
  # fresh version", so merging docs or fixes publishes nothing.
  workflow_run:
    workflows: ['Tests and performance']
    types: [completed]
    branches: [main]
  # Manual release by tag still works: bump Cargo.toml, tag v<version> and
  # push the tag. `prepare` enforces the tag/version agreement.
  push:
    tags:
      - 'v*'
  # Manual run: checks the builders and uploads artifacts for inspection.
  # Nothing reaches a release: `prepare` keeps should_publish=false.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  # Single source of truth for "should we release, and what": read the
  # manifest version, then decide per event. Every other job keys off its
  # outputs, so the builders and `publish` can never disagree about the
  # version or run when nothing is being released.
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
    env:
      EVENT: ${{ github.event_name }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # `workflow_run` fires after the CI completed on a specific main
          # commit: build exactly that commit, not whatever main points to
          # by the time this workflow starts.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Decide whether to publish
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as manifest:
              print(tomllib.load(manifest)["package"]["version"])
          PY
          )
          tag="v$version"
          sha="${HEAD_SHA:-$GITHUB_SHA}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml declares v$version"
          skip() {
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::notice::Manual run: the builders run and upload artifacts"
            echo "::notice::for inspection, but nothing is published."
            skip
          fi
          # One version, one release: if the tag already exists on the remote,
          # this version shipped. The public repo needs no credentials for a
          # plain `git ls-remote`, so this gate stays authentication-free.
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already exists: nothing new to release."
            skip
          fi
          if [ "$EVENT" = "workflow_run" ]; then
            if [ "$CI_CONCLUSION" != "success" ]; then
              echo "::notice::CI on main finished with '$CI_CONCLUSION':"
              echo "::notice::refusing to release an unverified commit."
              skip
            fi
            echo "::notice::Green CI on main with a fresh version: releasing"
            echo "::notice::$tag from commit $sha."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Remaining event: a tag push. The tag is the release instruction,
          # but it must agree with the manifest.
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::Tag $REF_NAME does not match Cargo.toml ($tag)."
              echo "::error::Bump the version in Cargo.toml, commit, then tag $tag."
              exit 1
            fi
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          skip

  # Unit tests before the heavy builds — for tag pushes only. The automatic
  # path skips this job: the CI run that triggered the release just ran the
  # same suite green on the very same commit.
  test:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run tests
        # One thread at a time: the undo-history flock is process-wide.
        run: cargo test --locked -- --test-threads=1

  linux:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 dpkg-dev binutils desktop-file-utils libfontconfig1-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libasound2-dev libvulkan-dev
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build the Debian package
        run: |
          desktop-file-validate packaging/virial-gpui.desktop
          ./build-deb.sh
          dpkg-deb --info target/debian/*.deb
      - name: Assemble the standalone archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          staging="dist/virial-gpui-$version-linux-x86_64"
          mkdir -p "$staging"
          install -Dm755 target/release/virial-gpui "$staging/virial-gpui"
          strip --strip-unneeded "$staging/virial-gpui"
          install -Dm644 packaging/virial-gpui.desktop "$staging/virial-gpui.desktop"
          install -Dm644 assets/images/virial-gpui-logo.png "$staging/virial-gpui.png"
          install -Dm644 LICENSE "$staging/LICENSE"
          install -Dm644 README.md "$staging/README.md"
          tar czf "dist/virial-gpui-$version-linux-x86_64.tar.gz" -C dist "$(basename "$staging")"
          rm -rf "$staging"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: virial-gpui-linux
          path: |
            target/debian/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  macos:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true' || github.event_name == 'workflow_dispatch'
    # macOS is the only runner that can compile the Metal (`macos-blade`) gpui
    # backend, so this job is a hard requirement for a final release: a
    # release that ships without it is a gap, and shipping one silently is
    # worse than not shipping at all. `publish` below refuses any partial set.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build the release binary
        run: cargo build --release --locked
      - name: Assemble the application bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          # Runner architecture moves between Apple Silicon and Intel
          # generations; name the artifact after what actually built it.
          arch=$(uname -m)
          app="dist/Virial.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          install -m755 target/release/virial-gpui "$app/Contents/MacOS/virial-gpui"

          # `iconutil` wants a namespaced iconset folder. The shipped logo is a
          # 279x254 raster, so `-Z` fits it inside a 1024 master and `-p` pads
          # that to a square canvas (it takes height *and* width) before the
          # rungs are cut. Replacing assets/images with a 1024px master is the
          # real fix for a crisp menu-bar icon.
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          sips -Z 1024 assets/images/virial-gpui-logo.png --out "$work/fitted.png" >/dev/null
          sips -p 1024 1024 "$work/fitted.png" --out "$work/master.png" >/dev/null
          mkdir -p "$work/Virial.iconset"
          cut() { sips -z "$2" "$2" "$work/master.png" --out "$work/Virial.iconset/icon_$1.png" >/dev/null; }
          cut 16x16 16;        cut 16x16@2x 32
          cut 32x32 32;        cut 32x32@2x 64
          cut 128x128 128;     cut 128x128@2x 256
          cut 256x256 256;     cut 256x256@2x 512
          cut 512x512 512;     cut 512x512@2x 1024
          iconutil -c icns "$work/Virial.iconset"
          # `iconutil` writes the .icns *next to* the .iconset folder, not
          # inside it, so look in both places rather than assume one.
          icns=$(find "$work" -maxdepth 2 -name '*.icns' -print -quit)
          if [ -z "$icns" ]; then
            echo "::error::iconutil produced no .icns from Virial.iconset"
            find "$work" -maxdepth 2 -type f | sed 's/^/  /'
            exit 1
          fi
          install -m644 "$icns" "$app/Contents/Resources/virial-gpui.icns"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Virial</string>
            <key>CFBundleDisplayName</key><string>Virial</string>
            <key>CFBundleIdentifier</key><string>io.github.charlyhno.virial-gpui</string>
            <key>CFBundleExecutable</key><string>virial-gpui</string>
            <key>CFBundleIconFile</key><string>virial-gpui</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSHumanReadableCopyright</key><string>Licensed under the terms in LICENSE.</string>
          </dict>
          </plist>
          PLIST
          printf 'APPL????' > "$app/Contents/PkgInfo"

          # Ad-hoc signature: no certificate here, but a signed bundle is a
          # structurally valid one and the check below fails loudly instead of
          # shipping something Gatekeeper rejects outright.
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          tar czf "dist/Virial-$version-macos-$arch.app.tar.gz" -C dist Virial.app
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: virial-gpui-macos
          path: dist/*.app.tar.gz
          if-no-files-found: error

  windows:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          echo "$env:ProgramFiles\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build the release executable
        shell: pwsh
        run: |
          cargo build --release --locked --features windows-resources
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/virial-gpui.exe dist/virial-gpui.exe
          # `src/main.rs` sets `windows_subsystem = "windows"` behind
          # `not(debug_assertions)`, so a release build must report
          # IMAGE_SUBSYSTEM_WINDOWS_GUI. Catching it here means a console
          # window can never flash on launch.
          $exe = (Resolve-Path dist/virial-gpui.exe).Path
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $pe = [System.BitConverter]::ToInt32($bytes, 0x3C)
          if ([System.BitConverter]::ToUInt16($bytes, $pe + 24) -ne 0x20B) {
            Write-Error "Expected a PE32+ image at the header offset"
            exit 1
          }
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          if ($subsystem -ne 2) {
            Write-Error "Expected IMAGE_SUBSYSTEM_WINDOWS_GUI (2), found $subsystem"
            exit 1
          }
          Write-Host "PE subsystem: $subsystem (GUI) on $exe"
          # The version resource must carry the product name, not the crate
          # name: Explorer's details pane reads it.
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductName -ne "Virial") {
            Write-Error "Expected ProductName 'Virial', found '$($info.ProductName)'"
            exit 1
          }
          Write-Host "ProductName: $($info.ProductName)"
      - name: Assemble the zip
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          Copy-Item README.md dist/README.md -ErrorAction SilentlyContinue
          Copy-Item LICENSE dist/LICENSE -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath "dist/virial-gpui-$version-windows-x86_64.zip" -Force
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: virial-gpui-windows
          path: |
            dist/virial-gpui.exe
            dist/*.zip
          if-no-files-found: error

  # One job creates the release and attaches everything, so the three builders
  # never race each other. The release action manages its credentials
  # internally (its GITHUB_TOKEN input defaults to the run's own identity), so
  # no credential line appears in this file.
  publish:
    needs: [prepare, linux, macos, windows]
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Collect every artifact
        uses: actions/download-artifact@v6
        with:
          pattern: virial-gpui-*
          path: out
          merge-multiple: true
      - name: Flatten the artifact tree
        # upload-artifact preserves the paths files lived at inside each
        # builder: the .deb lands in out/target/debian/, the macOS tarball in
        # out/dist/. Move everything to out/ so the platform check and the
        # release step operate on one flat directory.
        shell: bash
        run: |
          set -euo pipefail
          find out -mindepth 2 -type f -exec mv -t out {} +
          find out -mindepth 1 -type d -empty -delete
          ls -la out | sed 's/^/  /'
      - name: Require every platform before publishing
        # The whole point: a missing platform must fail the release loudly here
        # instead of quietly shipping a two-of-three download. Each builder names
        # its artifact by platform, so absence is a fact on disk, not a guess.
        # Counted with find over an explicit list so a missing pattern is an
        # empty result, never a failing `ls` (exit 2 would kill the script
        # under set -e before it could even report what was missing).
        # There is no partial-release escape hatch: a manual run never reaches
        # `publish`, and a failed builder must be fixed, not waved through.
        shell: bash
        run: |
          set -euo pipefail
          cd out
          missing=""
          has_deb=$(find . -maxdepth 1 -name '*.deb' | wc -l)
          has_linux=$(find . -maxdepth 1 -name '*.tar.gz' -name '*linux*' | wc -l)
          has_macos=$(find . -maxdepth 1 -name '*.tar.gz' -name '*macos*' | wc -l)
          has_exe=$(find . -maxdepth 1 -name '*.exe' | wc -l)
          echo "deb=$has_deb linux-tar=$has_linux macos-tar=$has_macos exe=$has_exe"
          if [ "$has_deb" -lt 1 ]; then missing="$missing deb"; fi
          if [ "$has_linux" -lt 1 ]; then missing="$missing linux-tar"; fi
          if [ "$has_macos" -lt 1 ]; then missing="$missing macos-tar"; fi
          if [ "$has_exe" -lt 1 ]; then missing="$missing windows-exe"; fi
          ls -la | sed 's/^/  /'
          if [ -n "$missing" ]; then
            echo "::error::Missing platform artifacts:$missing"
            echo "::error::Refusing to publish an incomplete release."
            echo "::error::Fix the failing builder and re-run the workflow."
            exit 1
          fi
          echo "All three platforms present."
      - name: Build the checksum file
        shell: bash
        run: |
          set -euo pipefail
          cd out
          sha256sum ./* | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release and attach every artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          # Automatic path: pin the tag to the exact commit the CI validated.
          # On a tag push this input is ignored, the ref is the tag itself.
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: Virial v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          # Re-runs replace previously uploaded assets instead of failing.
          overwrite_files: true
          files: |
            out/*
      - name: Report the published files
        if: always()
        shell: bash
        # The repository is public: an unauthenticated API read is enough to
        # list what just shipped.
        run: |
          curl -sf "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ needs.prepare.outputs.version }}" \
            | python3 -c "import json,sys; [print(f\"{a['name']}  {a['size']} bytes\") for a in json.load(sys.stdin)['assets']]"

  # After a successful publish, regenerate the README install table with the
  # assets that just shipped: each platform row shows the real file name as a
  # clickable download link. Runs only on the automatic path (a workflow_run
  # that published): a tag-push or inspection run must not rewrite docs. The
  # commit is mechanical — names and URLs read from the release API — which
  # is why it lands directly on main without a PR.
  docs-sync:
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: main
      - name: Regenerate the install table from the release assets
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request

          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          api = f"https://api.github.com/repos/{repo}/releases/tags/v{version}"
          with urllib.request.urlopen(api) as response:
              assets = {a["name"]: a["browser_download_url"]
                        for a in json.load(response)["assets"]}

          # One anchor per platform row, matched from the asset names the
          # builders upload. If an expected asset is missing the lookup fails
          # loudly: a half-published release must not silently rewrite docs.
          deb = assets[f"virial-gpui_{version}_amd64.deb"]
          macos_name = next(n for n in assets if re.match(r"Virial-.*\.app\.tar\.gz$", n))
          win_name = f"virial-gpui-{version}-windows-x86_64.zip"
          rows = (
              f"| 🐧 Linux | [`virial-gpui_{version}_amd64.deb`]({deb}) "
              f"| `sudo apt install ./virial-gpui_{version}_amd64.deb` — installs the launcher and the icon |\n"
              f"| 🍎 macOS | [`{macos_name}`]({assets[macos_name]}) "
              f"| Open the archive and drag `Virial.app` into Applications |\n"
              f"| 🪟 Windows | [`{win_name}`]({assets[win_name]}) "
              f"| Unzip anywhere and double-click `virial-gpui.exe` |\n"
          )

          with open("README.md", encoding="utf-8") as f:
              readme = f.read()
          table = re.compile(
              r"^\| 🐧 Linux \|.*?\n\| 🍎 macOS \|.*?\n\| 🪟 Windows \|.*?\n",
              re.S | re.M,
          )
          if not table.search(readme):
              raise SystemExit(
                  "::error::README.md: install table not found — "
                  "check the row format before rewriting it."
              )
          with open("README.md", "w", encoding="utf-8", newline="") as f:
              f.write(table.sub(rows, readme, count=1))
          print(f"Install table regenerated with v{version} asset links")
          PY
      - name: Commit the README update
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet README.md; then
            echo "README already shows v$VERSION; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): install table links the v$VERSION assets"
          git push origin main

  # Note: there is deliberately no crates.io job. virial-gpui is a binary crate
  # (no `src/lib.rs`), and crates.io refuses binary-only manifests, so such a
  # job could only ever install a toolchain and emit warnings. Applications ship
  # through GitHub Releases (`publish` above). If a library target is added, add
  # the job back with a `cargo publish --dry-run` step gated on `src/lib.rs`.
