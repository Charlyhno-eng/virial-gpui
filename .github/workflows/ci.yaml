name: Tests and performance

on:
  push:
    # `main` only: a branch with an open pull request already runs this
    # workflow as `pull_request` on `refs/pull/<n>/merge`, so a broad `push`
    # filter ran every commit twice, end to end. A `v*` tag must not trigger
    # this workflow either — release.yaml builds the very same release
    # profile on the same commit, so a tag would compile everything twice
    # on two different runners.
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # Every CI job compiles from scratch on a fresh runner, so cargo's
  # incremental cache buys nothing here and costs a lot of disk: it was 6.2 GB
  # of the 19 GB debug tree locally. Disabling it also speeds up full builds.
  CARGO_INCREMENTAL: '0'
  # sccache stores the compiled objects in the GitHub Actions cache backend.
  # Opt-in is per job through RUSTC_WRAPPER: the `lint` job runs clippy-driver,
  # whose invocations are not worth caching, so it keeps its plain cache.
  SCCACHE_GHA_ENABLED: 'true'

jobs:
  lint:
    # Gate for every PR merge: formatting, clippy and the changelog rule.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libfontconfig1-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libasound2-dev libvulkan-dev
      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/*.yaml
      - name: Install Rust stable with lint components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Restore cargo and build artefacts
        # The `lint` job is the only consumer of this debug cache: `linux`,
        # `windows`, `macos` and `package-and-benchmarks` all cache through
        # sccache instead (see the registry step below each of them). Only
        # the dependency artefacts are cached — the test binary and the debug
        # symbols are rewritten by every run and would push the archive
        # towards the 10 GB cache limit.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/deps
            target/debug/build
          key: ci-debug-lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-debug-lint-${{ runner.os }}-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint (clippy, tests included)
        # `--all-targets` compiles the test tree too, so this step doubles as
        # the compile the suite needs; the cache makes the second consumer pay
        # only the time to relink.
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Guard the CI job set
        # A bad conflict resolution in .github/workflows/ci.yaml once dropped
        # the `windows` job entirely (merge 29f2d41): its steps were absorbed
        # as dead steps at the tail of the `linux` job, the YAML stayed valid,
        # and Windows silently lost its CI. This structural check makes that
        # class of mistake fail loudly instead of silently.
        shell: bash
        run: |
          for job in lint linux windows macos package-and-benchmarks; do
            if ! grep -qE "^  ${job}:" .github/workflows/ci.yaml; then
              echo "::error::ci.yaml: job '${job}' is missing from the job set."
              echo "::error::A conflict resolution probably mangled the workflow;"
              echo "::error::restore the full job before merging."
              exit 1
            fi
          done
      - name: Require a changelog entry for the pull request
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          pending=$(awk '/^## \[Non publié\]/{flag=1; next} /^## /{flag=0} flag' CHANGELOG.md)
          if ! printf '%s' "$pending" | grep -q '^- '; then
            echo "::error::CHANGELOG.md: the [Non publié] section is empty."
            echo "::error::Every pull request must add an entry there (rule in AGENTS.md)."
            exit 1
          fi

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libfontconfig1-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libasound2-dev libvulkan-dev poppler-utils libmpv2 ffmpeg
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Restore the cargo registry
        # sccache replaces the target/ artefact cache: it keys compiled
        # objects by content hash, so one shared cache serves the debug and
        # release profiles alike and a Cargo.lock bump still reuses every
        # unchanged crate. actions/cache only covers the downloaded sources.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Run tests
        # Serial: the undo-history flock is process-wide, so parallel test
        # threads would contend for it and flake. On a warm sccache the
        # compile is nearly free; serial execution costs seconds, not minutes.
        run: cargo test --locked -- --test-threads=1

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          echo "$env:ProgramFiles\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Restore the cargo registry
        # Same rationale as the Linux job: sccache owns the compiled objects,
        # actions/cache only covers the downloaded sources.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Run tests
        # Serial like the macOS job: the undo history takes an exclusive lock
        # on `<data>/virial/undo/lock`, and the suite's filesystem fixtures
        # overlap enough for the parallel default to make that lock race fail.
        run: cargo test --locked -- --test-threads=1

  macos:
    # macOS runs the same suite with the Metal (`macos-blade`) gpui backend.
    # `continue-on-error` is deliberate: the runner is the only place that can
    # compile this target, so the job reports instead of gating Linux/Windows.
    runs-on: macos-14
    timeout-minutes: 45
    continue-on-error: true
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Restore the cargo registry
        # Same rationale as the Linux job: sccache owns the compiled objects,
        # actions/cache only covers the downloaded sources.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Run tests
        # macOS file operations are slower and the suite shares per-process lock
        # files, so run serial to avoid the lock-contention flakes.
        run: cargo test --locked -- --test-threads=1

  # Packaging and the ignored benchmarks both need the release profile, which
  # is a second full compile of gpui. They share one job so that compile is
  # paid once, and they run alongside the three test jobs instead of extending
  # the Linux one.
  #
  # A pull request that cannot affect the `.deb` or the benchmarks skips this
  # job: docs, README and CI-only patches pay nothing for it. Every other event
  # (push, tag, manual run) builds and uploads both, so release tags keep
  # producing the package and the performance trend is still measured on main.
  package-and-benchmarks:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.base.ref == 'main' ||
      contains(github.event.pull_request.labels.*.name, 'packaging') ||
      contains(github.event.pull_request.labels.*.name, 'performance')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config python3 dpkg-dev binutils desktop-file-utils libfontconfig1-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libasound2-dev libvulkan-dev
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Restore the cargo registry
        # Same rationale as the Linux job: sccache owns the compiled objects
        # (release profile included), actions/cache only covers the sources.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Build Debian package
        run: |
          desktop-file-validate packaging/virial-gpui.desktop
          ./build-deb.sh
          dpkg-deb --info target/debian/*.deb
      - name: Upload Debian package
        uses: actions/upload-artifact@v6
        with:
          name: virial-gpui-deb-ubuntu-24.04-amd64
          path: target/debian/*.deb
          if-no-files-found: error
      - name: Measure filesystem performance
        # The job compiles the release profile once and shares it: these tests
        # reuse the dependencies already built by build-deb.sh in the same
        # workspace, so each benchmark costs ~37 s instead of a second full
        # release build.
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked infrastructure::performance::filesystem_performance -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee performance.txt
      - name: Measure indexed search performance
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked infrastructure::search::index::tests::indexed_search_performance -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee -a performance.txt
      - name: Add performance results to summary
        if: always()
        shell: bash
        run: |
          if [ -f performance.txt ]; then
            {
              echo '### Filesystem performance (release, warm cache)'
              echo '```text'
              cat performance.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: filesystem-performance
          path: performance.txt
          if-no-files-found: ignore
          retention-days: 14
