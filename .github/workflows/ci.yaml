name: Tests and performance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Gate for every PR merge: formatting, clippy and the changelog rule.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Rust stable with lint components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint (clippy, tests included)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Require a changelog entry for the pull request
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          pending=$(awk '/^## \[Non publié\]/{flag=1; next} /^## /{flag=0} flag' CHANGELOG.md)
          if ! printf '%s' "$pending" | grep -q '^- '; then
            echo "::error::CHANGELOG.md: the [Non publié] section is empty."
            echo "::error::Every pull request must add an entry there (rule in AGENTS.md)."
            exit 1
          fi

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 dpkg-dev binutils desktop-file-utils libfontconfig1-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libasound2-dev libvulkan-dev poppler-utils libmpv2 ffmpeg
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run tests
        run: cargo test --locked
      - name: Build Debian package
        run: |
          desktop-file-validate packaging/virial-gpui.desktop
          ./build-deb.sh
          dpkg-deb --info target/debian/*.deb
      - name: Upload Debian package
        uses: actions/upload-artifact@v6
        with:
          name: virial-gpui-deb-ubuntu-24.04-amd64
          path: target/debian/*.deb
          if-no-files-found: error
      - name: Measure filesystem performance
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked infrastructure::performance::filesystem_performance -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee performance.txt
      - name: Measure indexed search performance
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked infrastructure::search::index::tests::indexed_search_performance -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee -a performance.txt
      - name: Add performance results to summary
        if: always()
        shell: bash
        run: |
          if [ -f performance.txt ]; then
            {
              echo '### Filesystem performance (release, warm cache)'
              echo '```text'
              cat performance.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: filesystem-performance
          path: performance.txt
          if-no-files-found: ignore
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          echo "$env:ProgramFiles\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run tests
        run: cargo test --locked
      - name: Build release executable
        shell: pwsh
        run: |
          cargo build --release --locked --features windows-resources
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/virial-gpui.exe dist/virial-gpui.exe
      - name: Upload Windows executable
        uses: actions/upload-artifact@v6
        with:
          name: virial-gpui-windows-x64
          path: dist/virial-gpui.exe
          if-no-files-found: error
